          <div class="flex items-center gap-2">

        <div class="gap-2">

              <p>Комплексные решения</p>
              <img src="./img/Group (22).png" alt="" />
            </div>
            <div class="flex items-center gap-2">
              <p>Наше оборудование</p>
              <img src="./img/Group (22).png" alt="" />
            </div>
            <div class="flex items-center gap-2">
              <p>Оснащение лабораторий</p>
              <img src="./img/Group (22).png" alt="" />

              <p>Услуги компании</p>
              <img src="./img/Group (22).png" alt="" />
            </div>
          </div>
        </div>
      </div>

      </div>

      <div

          <div class="flex flex-1 gap-4">

                <option>Область</option>
              </select>
              <span
                class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"

            <div class="relative flex-1">

                <option>Год</option>
              </select>
              <span
                class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"

            <div class="relative flex-1">
              <select
                class="w-full bg-transparent border border-gray-400 py-2 px-4 text-xs appearance-none focus:outline-none"
              >
                <option>Месяц</option>
              </select>

            </div>

        <div
          class="bg-[#fbb016] text-white text-xs py-2 px-4 flex items-center gap-3"
        >
          <span>Украина</span>
          <button class="hover:opacity-70">✕</button>
        </div>
        <div
          class="bg-[#fbb016] text-white text-xs py-2 px-4 flex items-center gap-3"
        >
          <span>Житомирская</span>
          <button class="hover:opacity-70">✕</button>

    <section class="max-w-[1200px] m-auto">
